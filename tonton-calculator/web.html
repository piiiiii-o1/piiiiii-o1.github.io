<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>真実のトントン価額計算機 - ウェブ版</title>
  <style>
    body {
      font-family: "Meiryo UI", Meiryo, sans-serif;
      background: #f8f9fa;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 760px;
      margin: 0 auto;
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    }
    h1 {
      text-align: center;
      color: #007bff;
      margin-bottom: 10px;
    }
    .input-group {
      margin: 15px 0;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }
    input {
      width: 100%;
      padding: 10px;
      font-size: 1.1em;
      border: 1px solid #ccc;
      border-radius: 6px;
    }
    button {
      margin-top: 20px;
      width: 100%;
      padding: 14px;
      font-size: 1.2em;
      background: #28a745;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    button:hover {
      background: #218838;
    }
    .result {
      margin-top: 25px;
      padding: 20px;
      background: #f0f8ff;
      border-radius: 8px;
      white-space: pre-line;
      font-size: 1.05em;
      line-height: 1.7;
    }
    .back {
      text-align: center;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>真実のトントン価額計算機</h1>
    <p style="text-align:center; color:#555;">税金20.315%を考慮した本当のトントン価格を計算</p>

    <div class="input-group">
      <label>1回目 約定価格 (円)</label>
      <input type="number" id="p1" value="41000">
    </div>

    <div class="input-group">
      <label>1回目 株数</label>
      <input type="number" id="q1" value="100">
    </div>

    <div class="input-group">
      <label>2回目 約定価格 (円)</label>
      <input type="number" id="p2" value="40000">
    </div>

    <div class="input-group">
      <label>2回目 株数</label>
      <input type="number" id="q2" value="100">
    </div>

    <button onclick="calculate()">計算する</button>

    <div id="result" class="result"></div>

    <div class="back">
      <a href="index.html">← 詳細ページに戻る</a> | 
      <a href="https://piiiiii-o1.github.io">ツール一覧に戻る</a>
    </div>
  </div>

  <script>
    function calculate() {
      const p1 = parseFloat(document.getElementById('p1').value);
      const p2 = parseFloat(document.getElementById('p2').value);
      const q1 = parseInt(document.getElementById('q1').value);
      const q2 = parseInt(document.getElementById('q2').value);
      const tax_rate = 0.20315;

      if (!p1 || !p2 || !q1 || !q2) {
        document.getElementById('result').innerHTML = "<span style='color:red;'>すべての項目を正しく入力してください。</span>";
        return;
      }

      const total_cost = p1 * q1 + p2 * q2;
      const total_shares = q1 + q2;
      const avg_price = total_cost / total_shares;

      // 低値ロット判定
      let low_price, low_qty;
      if (p1 <= p2) {
        low_price = p1;
        low_qty = q1;
      } else {
        low_price = p2;
        low_qty = q2;
      }

      let true_s;
      if (Math.abs(p1 - p2) < 0.01) {
        true_s = avg_price;
      } else {
        const numerator = total_cost - (low_price * low_qty * tax_rate);
        const denominator = total_shares - (low_qty * tax_rate);
        true_s = numerator / denominator;
      }

      // 検証
      const total_sell = total_shares * true_s;
      const low_profit = (true_s - low_price) * low_qty;
      const tax = low_profit * tax_rate;
      const net = total_sell - tax;
      const high_loss = Math.abs((true_s - (p1 === low_price ? p2 : p1)) * (p1 === low_price ? q2 : q1));

      document.getElementById('result').innerHTML = `
平均取得価額　　　 : ${avg_price.toLocaleString('ja-JP', {minimumFractionDigits: 2})} 円<br>
<span style="font-size:1.3em; font-weight:bold; color:#007bff;">真実のトントン価額 : ${true_s.toLocaleString('ja-JP', {minimumFractionDigits: 2})} 円</span><br><br>
────────────────────<br>
・総売却額　　　　　 : ${total_sell.toLocaleString('ja-JP')} 円<br>
・低値ロット利益　　 : ${low_profit.toLocaleString('ja-JP')} 円<br>
・税金（20.315%）　　: ${tax.toLocaleString('ja-JP')} 円<br>
・高値ロット含み損　 : ${high_loss.toLocaleString('ja-JP')} 円<br>
・税引後手取り　　　 : ${net.toLocaleString('ja-JP')} 円<br><br>
→ 投資総額 ${total_cost.toLocaleString('ja-JP')}円 と完全に一致（トントン）
      `;
    }

    // ページ読み込み時に1回計算
    window.onload = calculate;
  </script>
</body>
</html>
